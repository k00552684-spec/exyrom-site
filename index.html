<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExyROM & Kernel Downloads</title>
  
  <!-- Modern Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070d19;
      --card-bg: rgba(13, 20, 36, 0.65);
      --card-border: rgba(125, 211, 252, 0.15);
      --card-border-hover: rgba(125, 211, 252, 0.4);
      --accent-pastel-blue: #7dd3fc;
      --accent-sky: #38bdf8;
      --accent-light: #bae6fd;
      --text-main: #f0f9ff;
      --text-muted: #94a3b8;
      --telegram-blue: #229ED9;
    }

    /* Custom Sleek Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(125, 211, 252, 0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-sky); }

    html { scroll-behavior: smooth; }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glow Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
      animation: floatOrb 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 350px; height: 350px; background: rgba(125, 211, 252, 0.12); top: -50px; left: -50px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(56, 189, 248, 0.08); bottom: -100px; right: -50px; animation-delay: -6s; }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.1); }
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.75rem; }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 2.75rem 2rem;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .brand-title {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-light) 50%, var(--accent-sky) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }

    .brand-subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; font-weight: 500; }

    .btn-telegram {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.6rem;
      border-radius: 14px;
      background: linear-gradient(135deg, #229ED9, #1a82b4);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(34, 158, 217, 0.25);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-telegram:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 15px 30px rgba(34, 158, 217, 0.4);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 1rem;
      z-index: 100;
      background: rgba(7, 13, 25, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.75rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .filter-tabs { display: flex; gap: 0.5rem; }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tab-btn.active {
      background: var(--accent-pastel-blue);
      color: #031020;
      border-color: var(--accent-pastel-blue);
      box-shadow: 0 0 20px rgba(125, 211, 252, 0.3);
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: rgba(13, 20, 36, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.7rem 1.2rem;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      border-color: var(--accent-pastel-blue);
      box-shadow: 0 0 15px rgba(125, 211, 252, 0.2);
    }

    /* Dynamic Card Styles with Scroll Reveal */
    .builds-list { display: flex; flex-direction: column; gap: 1.25rem; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 1.6rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      transform: translateY(30px);
    }

    /* Class added by JS when scrolled into view */
    .card.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--card-border-hover);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(125, 211, 252, 0.12);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }

    .build-title { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }

    .badge {
      padding: 0.3rem 0.85rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-rom { background: rgba(125, 211, 252, 0.15); color: var(--accent-pastel-blue); border: 1px solid rgba(125, 211, 252, 0.3); }
    .badge-kernel { background: rgba(56, 189, 248, 0.15); color: var(--accent-sky); border: 1px solid rgba(56, 189, 248, 0.3); }

    .build-meta { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1rem; display: flex; gap: 1.25rem; flex-wrap: wrap; font-weight: 500; }

    .changelog {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.9rem 1.2rem;
      border-radius: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .btn-dl {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-pastel-blue), var(--accent-sky));
      color: #031020;
      padding: 0.85rem;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px rgba(125, 211, 252, 0.15);
    }

    .btn-dl:hover { 
      transform: scale(1.01); 
      box-shadow: 0 8px 25px rgba(125, 211, 252, 0.35);
    }

    /* Floating Back to Top Button */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent-pastel-blue);
      color: #031020;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 25px rgba(125, 211, 252, 0.3);
      z-index: 99;
    }

    .back-to-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .back-to-top:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <!-- Background Glow Effects -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
    <header>
      <h1 class="brand-title">ExyROM Hub</h1>
      <p class="brand-subtitle">Official Builds, Kernels & Release Downloads</p>
      <a href="https://t.me/ExyROMs" target="_blank" class="btn-telegram">✈️ Official Telegram Channel</a>
    </header>

    <!-- Controls Bar -->
    <div class="controls">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
        <button class="tab-btn" onclick="setFilter('rom', this)">ROMs</button>
        <button class="tab-btn" onclick="setFilter('kernel', this)">Kernels</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by device or build name..." oninput="renderBuilds()">
    </div>

    <!-- Dynamic Cards Container -->
    <div class="builds-list" id="buildsList"></div>
  </div>

  <!-- Scroll to top button -->
  <button class="back-to-top" id="scrollTopBtn" onclick="scrollToTop()">↑</button>

  <script>
    const buildsData = [
      // 1. Everline kernel
      {
        title: "Everline kernel",
        category: "kernel",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 13 to 16",
        date: "26 Jul 2026",
        changelog: "ched/uclamp: Move tunables to cpuctl, sched/uclamp: Expose latency_sensitive and uclamp.boosted ",
        Notice: `-Only support builds 25.07.2026 or newer
                 -crDroid not compatible`,
        downloadUrl: "https://sourceforge.net/projects/parbindar7-builds/files/Everline%2025-07-2026/"
      },

      // 2. Everline kernel
      {
        title: "Everline kernel",
        category: "kernel",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 13 to 16",
        date: "18 May 2026",
        changelog: `-sched: fix uclamp_boosted(), BACKPORT: Add min_task_util_for_boost and min_task_util_for_uclamp
                    -sched/cpufreq_schedutil: use UCLAMP_MIN in sugov_need_slack_timer(), Fixup: sched/uclamp: sched: Fix cpuset_cgrp_id in uclamp_latency_sensitive 
                    -sched: Replace schedtune with uclamp, BACKPORT: sched/cpufreq_schedutil: Make iowait boost uclamp-aware
                    -BACKPORT: sched/fair: Make cpu_overutilized() uclamp-aware, BACKPORT: sched/uclamp: Simplify uclamp_tg_restrict() using clamp()
                    -sched/cpufreq_schedutil: Fix undefined uclamp_rq_util_with(), Fixup: sched/cpufreq: remove rq-level uclamp_min floor`,
        downloadUrl: "https://sourceforge.net/projects/parbindar7-builds/files/Everline%2018-05-2026/"
      },

      // 3. Project Matrixx os v12.3 (official)
      {
        title: "Project Matrixx os v12.3 (official)",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "2026-05",
        changelog: "-contain all previous commits",
        downloadUrl: "https://sourceforge.net/projects/projectmatrixx/files/Android-16/"
      },

      // 4. InfinityX v3.10
      {
        title: "InfinityX v3.10",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "05 May 2026",
        changelog: `-contain all previous commits
                    -OTA push`,
        downloadUrl: "https://github.com/Parbindar7/OTA/releases/tag/InfinityX_06-05-2026"
      },
      
      // 7. Afterlife OS v8.4 (official)
      {
        title: "Afterlife OS v8.4 (official)",
        category: "rom",
        device: "Samsung Galaxy M31, m21, a51",
        android: "Android 16",
        date: "2026-04-23",
        changelog: `-nable frame pacing, Define screenRecorderAVCProfileLevel
                    -Decrease launch boost to 3sec
                    -Tune schedutil rate limits
                    -HWC Adapt from exynos9630 T BSP
                    -adapt struct decon_win_config_data to exynos9610
                    -fix missing dmabuf_trace_free call on buffer release path
                    -free exporter name on buffer release
                    -CONFIG_HZ to 300`,
        downloadUrl: "https://afterlifeos.com/download"
      },

      // 8. Lineage OS v23.2
      {
        title: "Lineage OS v23.2",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41,a51",
        android: "Android 16",
        date: "26-07-2026",
        changelog: `-Refactor Powerhint.json
                    -Tune up/down frequency rate limits
                    -Cleanup task_profiles_30.json`,
        downloadUrl: "https://drive.google.com/drive/folders/1sUjnPe88Q6sRX2-8nxYO37ac-MDAmhyj?usp=sharing"
      },

      // 9. Lineage OS v23.2
      {
        title: "Lineage OS v23.2",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "01-07-2026",
        changelog: `-efactor Powerhint.json
                    -Add software c2 av1/dav1d decoder
                    -Move media codecs configurations on tree`,
        downloadUrl: "https://drive.google.com/drive/folders/1OvkxJulj3QWW-0S4u0Kq8DKxLjsmJs_Y?usp=sharing"
      },

      // 10. Lineage OS v23.2
      {
        title: "Lineage OS v23.2",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "02-05-2026",
        changelog: `-Powerhint: Re-tune for efficiency
                    -Powerhint: Cleanup
                    -Powerhint: Add UclampTAMin & UclampTALatency
                    -Powerhint: Add UclampTAMin to LAUNCH
                    -Powerhint: Refactor powerhint.json
                    -Update cpuset parameters
                    -Migrate from Schedtune to Uclamp
                    -Drop schedtune
                    -Refactor task_profiles for to reflect Uclamp changes`,
        downloadUrl: "https://drive.google.com/drive/folders/1quhVFJwp1_wL0WKlpM4YqvpQs_oq9yvM?usp=sharing"
      },
      
      // 12. Voltage OS v5.8
      {
        title: "Voltage OS v5.8",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "2026-04-25",
        changelog: `-Re-tune POWERHINT for efficiency
                    -Boost CPU on EXPENSIVE_RENDERING
                    -set TARGET_CPU_VARIANT to cortex-a73`,
        downloadUrl: "https://drive.google.com/drive/folders/16UW_O8Megsh4MpqPprNJgv4JV1j4taP5?usp=sharing"
      },

      // 13. Lineage OS v23.2
      {
        title: "Lineage OS v23.2",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "2026-04-20",
        changelog: `-Blur Disabled
                    -Enable frame pacing
                    -Define screenRecorderAVCProfileLevel
                    -Decrease launch boost to 3sec
                    -Tune schedutil rate limits
                    -HWC Adapt from exynos9630 T BSP
                    -adapt struct decon_win_config_data to exynos9610
                    -fix missing dmabuf_trace_free call on buffer release path
                    -free exporter name on buffer release
                    -CONFIG_HZ to 300`,
        downloadUrl: "https://drive.google.com/drive/folders/1coT6KSsNsyvF5VHY57uvHnj7pNAfHQo_?usp=drive_link"
      },

      // 14. Matrixx OS v12.2 (official)
      {
        title: "Matrixx OS v12.2 (official)",
        category: "rom",
        device: "Samsung Galaxy M31, m31s, m21, f41, a51",
        android: "Android 16",
        date: "2026-04-13",
        changelog: `-Blur Disabled
                    -Decrease launch boost to 3sec
                    -Tune schedutil rate limits
                    -HWC Adapt from exynos9630 T BSP
                    -adapt struct decon_win_config_data to exynos9610
                    -fix missing dmabuf_trace_free call on buffer release path
                    -free exporter name on buffer release`,
        downloadUrl: "https://drive.google.com/drive/folders/1b_54tfSj5k1Ypmu07LL8pKS-JnuF9eXm?usp=sharing"
      },
    ];


    let currentFilter = 'all';

    // IntersectionObserver for Scroll Animations
    const observerOptions = { threshold: 0.1, rootMargin: "0px 0px -50px 0px" };
    const scrollObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('reveal');
          scrollObserver.unobserve(entry.target);
        }
      });
    }, observerOptions);

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBuilds();
    }

    function renderBuilds() {
      const container = document.getElementById('buildsList');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = buildsData.filter(item => {
        const matchesCategory = currentFilter === 'all' || item.category === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.device.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 3rem; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border);">No builds found matching your search.</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="build-title">${item.title}</div>
            <span class="badge ${item.category === 'rom' ? 'badge-rom' : 'badge-kernel'}">${item.category.toUpperCase()}</span>
          </div>
          <div class="build-meta">
            <span>📱 ${item.device}</span>
            <span>🤖 ${item.android}</span>
            <span>📅 ${item.date}</span>
          </div>
          <div class="changelog">
            <strong>Changelog:</strong> ${item.changelog}
          </div>
          <a href="${item.downloadUrl}" target="_blank" class="btn-dl">📥 Download File / Open Link</a>
        `;
        container.appendChild(card);
        
        // Attach observer to trigger smooth scroll animation
        scrollObserver.observe(card);
      });
    }

    // Scroll-to-Top Button Listener
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollTopBtn.classList.add('visible');
      } else {
        scrollTopBtn.classList.remove('visible');
      }
    });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderBuilds();
  </script>
</body>
</html>
