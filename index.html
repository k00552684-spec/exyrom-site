<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExyROM & Kernel Downloads</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #38bdf8;
      --accent-purple: #a855f7;
      --accent-green: #34d399;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --telegram-blue: #229ED9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 2rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle { color: var(--text-muted); font-size: 1rem; margin: 0.5rem 0 1.25rem 0; }

    .btn-telegram {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      background: var(--telegram-blue);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.9rem;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .filter-tabs { display: flex; gap: 0.5rem; }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.65rem 1rem;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
    }

    /* Download Cards */
    .builds-list { display: flex; flex-direction: column; gap: 1.25rem; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }

    .build-title { font-size: 1.3rem; font-weight: 700; }

    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .badge-rom { background: rgba(56, 189, 248, 0.15); color: var(--accent-cyan); border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-kernel { background: rgba(168, 85, 247, 0.15); color: var(--accent-purple); border: 1px solid rgba(168, 85, 247, 0.3); }

    .build-meta { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem; display: flex; gap: 1rem; flex-wrap: wrap; }

    .changelog {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .btn-dl {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #000;
      padding: 0.75rem;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .btn-dl:hover { transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 class="brand-title">ExyROM Hub</h1>
      <p class="brand-subtitle">Official Builds, Kernels & Release Downloads</p>
      <a href="https://t.me/ExyROM" target="_blank" class="btn-telegram">✈️ Official Telegram Channel</a>
    </header>

    <!-- Filters & Search Bar -->
    <div class="controls">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
        <button class="tab-btn" onclick="setFilter('rom', this)">ROMs</button>
        <button class="tab-btn" onclick="setFilter('kernel', this)">Kernels</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by device or build name..." oninput="renderBuilds()">
    </div>

    <!-- Container for dynamic cards -->
    <div class="builds-list" id="buildsList"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 📁 EDIT / ADD YOUR ROMS & KERNELS HERE IN THIS LIST!
    // -------------------------------------------------------------
    const buildsData = [
      {
        title: "ExyROM v1.0 — Official",
        category: "rom", // "rom" or "kernel"
        device: "Samsung Galaxy M31",
        android: "Android 14",
        date: "Aug 2026",
        changelog: "Initial release, KernelSU integrated, decryption fixes, maximum battery profile.",
        downloadUrl: "https://t.me/ExyROM" // Paste Telegram post link or SourceForge/Drive link
      },
      {
        title: "ExyKernel v1.2 — Performance",
        category: "kernel",
        device: "Samsung Galaxy M31",
        android: "Android 14 / 15",
        date: "Aug 2026",
        changelog: "CPU overclocked, SuSFS support enabled, WireGuard VPN kernel module included.",
        downloadUrl: "https://t.me/ExyROM"
      },
      {
        title: "ExyROM v0.9 — Beta Build",
        category: "rom",
        device: "OnePlus 12R",
        android: "Android 15",
        date: "Jul 2026",
        changelog: "OxygenOS base optimizations, unlocked 120Hz gaming mode.",
        downloadUrl: "https://t.me/ExyROM"
      }
    ];

    let currentFilter = 'all';

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBuilds();
    }

    function renderBuilds() {
      const container = document.getElementById('buildsList');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = buildsData.filter(item => {
        const matchesCategory = currentFilter === 'all' || item.category === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.device.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 2rem;">No builds found matching your search.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="build-title">${item.title}</div>
            <span class="badge ${item.category === 'rom' ? 'badge-rom' : 'badge-kernel'}">${item.category.toUpperCase()}</span>
          </div>
          <div class="build-meta">
            <span>📱 ${item.device}</span>
            <span>🤖 ${item.android}</span>
            <span>📅 ${item.date}</span>
          </div>
          <div class="changelog">
            <strong>Changelog:</strong> ${item.changelog}
          </div>
          <a href="${item.downloadUrl}" target="_blank" class="btn-dl">📥 Download File / View Post</a>
        `;
        container.appendChild(card);
      });
    }

    renderBuilds();
  </script>
</body>
</html>
