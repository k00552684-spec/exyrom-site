<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExyROM & Kernel Downloads</title>
  
  <!-- Modern Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a1120;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(125, 211, 252, 0.18);
      --accent-pastel-blue: #7dd3fc;
      --accent-sky: #38bdf8;
      --accent-light: #bae6fd;
      --text-main: #f0f9ff;
      --text-muted: #94a3b8;
      --telegram-blue: #229ED9;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 10% 10%, rgba(125, 211, 252, 0.12) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(56, 189, 248, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }

    .brand-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-sky));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle { color: var(--text-muted); font-size: 1rem; margin: 0.5rem 0 1.5rem 0; font-weight: 500; }

    .btn-telegram {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 14px;
      background: var(--telegram-blue);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-telegram:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(34, 158, 217, 0.3);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }

    .filter-tabs { display: flex; gap: 0.5rem; }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-pastel-blue);
      color: #031020;
      border-color: var(--accent-pastel-blue);
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.7rem 1.2rem;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-pastel-blue);
    }

    /* Download Cards */
    .builds-list { display: flex; flex-direction: column; gap: 1.25rem; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }

    .build-title { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }

    .badge {
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-rom { background: rgba(125, 211, 252, 0.15); color: var(--accent-pastel-blue); border: 1px solid rgba(125, 211, 252, 0.3); }
    .badge-kernel { background: rgba(56, 189, 248, 0.15); color: var(--accent-sky); border: 1px solid rgba(56, 189, 248, 0.3); }

    .build-meta { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1rem; display: flex; gap: 1rem; flex-wrap: wrap; font-weight: 500; }

    .changelog {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .btn-dl {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-pastel-blue), var(--accent-sky));
      color: #031020;
      padding: 0.8rem;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-dl:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 8px 20px rgba(125, 211, 252, 0.25);
    }
  </style>
</head>

    let currentFilter = 'all';

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBuilds();
    }

    function renderBuilds() {
      const container = document.getElementById('buildsList');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      const filtered = buildsData.filter(item => {
        const matchesCategory = currentFilter === 'all' || item.category === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery) || item.device.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 2rem;">No builds found matching your search.</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <div class="build-title">${item.title}</div>
            <span class="badge ${item.category === 'rom' ? 'badge-rom' : 'badge-kernel'}">${item.category.toUpperCase()}</span>
          </div>
          <div class="build-meta">
            <span>📱 ${item.device}</span>
            <span>🤖 ${item.android}</span>
            <span>📅 ${item.date}</span>
          </div>
          <div class="changelog">
            <strong>Changelog:</strong> ${item.changelog}
          </div>
          <a href="${item.downloadUrl}" target="_blank" class="btn-dl">📥 Download File / Open Link</a>
        `;
        container.appendChild(card);
      });
    }

    renderBuilds();
