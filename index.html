<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project-ExyROMs</title>
  
  <!-- Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #16100e;
      --card-bg: rgba(33, 24, 21, 0.85);
      --card-border: rgba(220, 185, 160, 0.2);
      --card-border-hover: rgba(220, 185, 160, 0.5);
      --accent-pastel-brown: #e6c5ac;
      --accent-warm: #d8a47f;
      --accent-light: #f7e8dc;
      --text-main: #faf5f0;
      --text-muted: #bdae9e;
      --telegram-blue: #229ED9;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(230, 197, 172, 0.25); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-warm); }

    html { scroll-behavior: smooth; }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 4rem 1rem;
      overflow-x: hidden;
      position: relative;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
    }
    .orb-1 { width: 350px; height: 350px; background: rgba(230, 197, 172, 0.12); top: -50px; left: -50px; }
    .orb-2 { width: 400px; height: 400px; background: rgba(216, 164, 127, 0.08); bottom: -100px; right: -50px; }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.75rem; }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 2.5rem 2rem;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .brand-title {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, var(--accent-light) 50%, var(--accent-pastel-brown) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
      .brand-header-flex {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 0.25rem;
    }

    .android-logo {
      width: 48px;
      height: 48px;
      fill: var(--accent-pastel-brown);
      filter: drop-shadow(0 2px 8px rgba(230, 197, 172, 0.25));
    }

    .brand-subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 1.5rem; font-weight: 500; }

    .btn-telegram {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.8rem 1.6rem;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-pastel-brown), var(--accent-warm));
      color: #1a100a;
      font-weight: 700;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: 0 10px 25px rgba(230, 197, 172, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-telegram:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(230, 197, 172, 0.35);
    }

    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 1rem;
      z-index: 100;
      background: rgba(22, 16, 14, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.75rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .filter-tabs { display: flex; gap: 0.5rem; }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.65rem 1.25rem;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-pastel-brown);
      color: #1a100a;
      border-color: var(--accent-pastel-brown);
      box-shadow: 0 0 20px rgba(230, 197, 172, 0.3);
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: rgba(33, 24, 21, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.7rem 1.2rem;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
    }

    .search-input:focus {
      border-color: var(--accent-pastel-brown);
    }

    .builds-list { display: flex; flex-direction: column; gap: 1.25rem; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 1.6rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-border-hover);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(230, 197, 172, 0.15);
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }

    .build-title { font-size: 1.35rem; font-weight: 700; color: var(--text-main); }

    .badge {
      padding: 0.3rem 0.85rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-rom { background: rgba(230, 197, 172, 0.15); color: var(--accent-pastel-brown); border: 1px solid rgba(230, 197, 172, 0.3); }
    .badge-kernel { background: rgba(216, 164, 127, 0.15); color: var(--accent-warm); border: 1px solid rgba(216, 164, 127, 0.3); }
    .badge-gapps { background: rgba(247, 232, 220, 0.2); color: var(--accent-light); border: 1px solid rgba(247, 232, 220, 0.4); }

    .build-meta { color: var(--text-muted); font-size: 0.88rem; margin-bottom: 1rem; display: flex; gap: 1.25rem; flex-wrap: wrap; font-weight: 500; }

    .changelog {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 0.9rem 1.2rem;
      border-radius: 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    .btn-dl {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, var(--accent-pastel-brown), var(--accent-warm));
      color: #1a100a;
      padding: 0.85rem;
      border-radius: 14px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(230, 197, 172, 0.15);
    }

    .btn-dl:hover { 
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(230, 197, 172, 0.35);
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="container">
   <header>
      <div class="brand-header-flex">
        <!-- Pastel Brown Android Head Logo -->
        <svg class="android-logo" viewBox="0 0 24 24">
          <path d="M17.523 15.3414C17.0601 15.3414 16.6873 14.9686 16.6873 14.5057C16.6873 14.0428 17.0601 13.67 17.523 13.67C17.9859 13.67 18.3587 14.0428 18.3587 14.5057C18.3587 14.9686 17.9859 15.3414 17.523 15.3414ZM6.47702 15.3414C6.01413 15.3414 5.64132 14.9686 5.64132 14.5057C5.64132 14.0428 6.01413 13.67 6.47702 13.67C6.93991 13.67 7.31272 14.0428 7.31272 14.5057C7.31272 14.9686 6.93991 15.3414 6.47702 15.3414ZM17.9234 10.3732L19.7891 7.142C19.9248 6.90696 19.8443 6.60627 19.6092 6.47057C19.3742 6.33486 19.0735 6.41539 18.9378 6.65042L17.0396 9.93836C15.5392 9.25464 13.8291 8.86877 12 8.86877C10.1709 8.86877 8.46083 9.25464 6.9604 9.93836L5.06223 6.65042C4.92652 6.41539 4.62583 6.33486 4.3908 6.47057C4.15576 6.60627 4.07524 6.90696 4.21095 7.142L6.07662 10.3732C2.71618 12.2036 0.435547 15.6881 0.435547 19.7578H23.5645C23.5645 15.6881 21.2838 12.2036 17.9234 10.3732Z"/>
        </svg>
        <h1 class="brand-title">Project-ExyROMs</h1>
      </div>
      <p class="brand-subtitle">Official Builds, Kernels & Release Downloads</p>
      <a href="https://t.me/ExyROMs" target="_blank" class="btn-telegram">Official Telegram Channel</a>
    </header>
    <div class="controls">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">All</button>
        <button class="tab-btn" onclick="setFilter('rom', this)">ROMs</button>
        <button class="tab-btn" onclick="setFilter('kernel', this)">Kernels</button>
        <button class="tab-btn" onclick="setFilter('gapps', this)">Gapps</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search by device or build name..." oninput="renderBuilds()">
    </div>

    <div class="builds-list" id="buildsList"></div>
  </div>

      // 4. InfinityX v3.10
      {
        title: "InfinityX v3.10",
        category: "rom",

        date: "05 May 2026",

      // 7. Afterlife OS v8.4 (official)
      {
        title: "Afterlife OS v8.4 (official)",
        category: "rom",
        device: "Samsung Galaxy M31, M31s, M21, F41, A51",
        android: "Android 16",
        date: "2026-04-23",
        changelog: `1.Enable frame pacing
                    2.Define screenRecorderAVCProfileLevel
                    3.Decrease launch boost to 3sec

                    5.HWC Adapt from exynos9630 T BSP

                    7.fix missing dmabuf_trace_free call on buffer release path

      // 8. Lineage OS v23.2
      {

                    8.Drop schedtune
                    9.Refactor task_profiles for to reflect Uclamp changes`,
        downloadUrl: "https://drive.google.com/drive/folders/1quhVFJwp1_wL0WKlpM4YqvpQs_oq9yvM?usp=sharing"
      },

    var currentFilter = "all";

    function setFilter(filter, btn) {
      currentFilter = filter;
      var buttons = document.querySelectorAll(".tab-btn");
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
      }
      btn.classList.add("active");
      renderBuilds();
    }

    function renderBuilds() {
      var container = document.getElementById("buildsList");
      if (!container) return;

      var searchInput = document.getElementById("searchInput");
      var searchQuery = searchInput ? searchInput.value.toLowerCase() : "";
      container.innerHTML = "";

      var filtered = buildsData.filter(function(item) {
        var cat = (item.category || "rom").toLowerCase();
        var matchesCategory = (currentFilter === "all") || (cat === currentFilter);
        var matchesSearch = (item.title || "").toLowerCase().indexOf(searchQuery) !== -1 || 
                            (item.device || "").toLowerCase().indexOf(searchQuery) !== -1;
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 3rem; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--card-border);">No builds found matching your search.</div>';
        return;
      }

      for (var j = 0; j < filtered.length; j++) {
        var item = filtered[j];
        var cat = (item.category || "rom").toLowerCase();
        var badgeClass = "badge-" + cat;

        var card = document.createElement("div");
        card.className = "card";
        card.innerHTML = 
          '<div class="card-header">' +
            '<div class="build-title">' + item.title + '</div>' +
            '<span class="badge ' + badgeClass + '">' + cat.toUpperCase() + '</span>' +
          '</div>' +
          '<div class="build-meta">' +
            '<span> ' + item.device + '</span> ' +
            '<span> ' + item.android + '</span> ' +
            '<span> ' + item.date + '</span>' +
          '</div>' +
          '<div class="changelog">' +
            '<strong>Changelog:</strong> ' + item.changelog +
          '</div>' +
          '<a href="' + item.downloadUrl + '" target="_blank" class="btn-dl">📥 Download File / Open Link</a>';

        container.appendChild(card);
      }
    }

    renderBuilds();
  </script>
</body>
</html>
